name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/vtop_system
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/vtop_system_test
      JWT_SECRET: ci-secret
      MAIL_LOG: "off"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Unit, integration and HTTP tests for the student, instructor and admin roles.
      - run: npm test
      # Full data set: every student of both semesters holds a complete
      # programme, no clashes, and every section gets a room.
      - name: Seed full data set
        run: npm run seed
      - name: Audit seeded term
        run: npm run audit

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  data:
    name: Semester 7 data matches the spreadsheet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python import_semester_timetable.py "B.Tech_CE_2023_Sem 7_Div_5.xlsx"
      - name: Seed CSVs are up to date
        run: git diff --exit-code -- data/csv
